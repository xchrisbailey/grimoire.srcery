name: Release

# Pushing a tag like v1.0.0-beta.2 builds the Mac DMG with
# scripts/package-mac.sh and attaches it to that tag's GitHub release,
# creating a prerelease if none exists.
#
# With the signing secrets set (see "Releasing from CI" in the README), the app
# and DMG are signed with the Developer ID certificate and the DMG is notarized
# and stapled. Without them the build is ad-hoc signed, as before.
#
# With those and SPARKLE_PRIVATE_KEY set, it then publishes the update feed
# (appcast.xml) to GitHub Pages, after the DMG is on the release. The release
# workflow owns the whole Pages site: each deploy replaces it. Before packaging,
# it fails if the build number in project.yml isn't higher than the published feed's.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    name: Package Mac DMG
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      SIGNED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      # The feed needs a signed, notarized build and the EdDSA key.
      PUBLISH_FEED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.SPARKLE_PRIVATE_KEY != '' }}
    outputs:
      publish_feed: ${{ env.PUBLISH_FEED }}
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen

      # A throwaway keychain holds the certificate and the notary credentials,
      # and becomes the default so codesign and notarytool find them.
      - name: Set up signing
        if: env.SIGNED == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$keychain"

          # The team ID comes from the certificate's name, "Developer ID Application: Name (TEAMID)".
          team=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"Developer ID Application: .*(\([A-Z0-9]*\))".*/\1/p' | head -1)
          [ -n "$team" ] || { echo "The certificate has no Developer ID Application identity." >&2; exit 1; }
          echo "TEAM_ID=$team" >> "$GITHUB_ENV"

          printf '%s\n' "$API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials grimoire-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"

      - name: Check the build number is higher than the published feed's
        if: env.PUBLISH_FEED == 'true'
        run: scripts/check-build-number.sh

      - name: Package
        run: scripts/package-mac.sh "${TAG#v}"
      - name: Upload to release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --prerelease --verify-tag --title "Grimoire ${TAG#v}" --generate-notes
          gh release upload "$TAG" dist/*.dmg dist/*.sha256 --clobber

      # After the DMG is on the release, so the feed never points at a missing file.
      - name: Build the update feed
        if: env.PUBLISH_FEED == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        # Sign the DMG as the release serves it, so the feed matches what users download
        # even when this run replaced an earlier attempt's upload.
        run: |
          gh release download "$TAG" --pattern "Grimoire-${TAG#v}.dmg" --dir release --clobber
          scripts/make-appcast.sh "$TAG" "release/Grimoire-${TAG#v}.dmg" feed
      # A fixed name, so the feed job finds it when it alone is re-run; a re-run of
      # this job replaces the earlier attempt's copy.
      - name: Keep the update feed
        if: env.PUBLISH_FEED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: feed
          path: feed
          if-no-files-found: error
          overwrite: true

      - name: Remove the signing keychain and key
        if: always() && env.SIGNED == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  # Replaces the whole GitHub Pages site with the feed. A separate job, because
  # the Pages actions run on Linux and need their own permissions.
  feed:
    name: Publish update feed
    needs: mac
    if: needs.mac.outputs.publish_feed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: feed
          path: feed
      # Named by attempt, because the Pages artifact can't be replaced within a run
      # and a re-run of this job is a new attempt.
      - uses: actions/upload-pages-artifact@v5
        with:
          name: pages-${{ github.run_attempt }}
          path: feed
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: pages-${{ github.run_attempt }}
