name: Release

# Pushing a tag like v1.0.0-beta.2 builds the Mac DMG with
# scripts/package-mac.sh and attaches it to that tag's GitHub release,
# creating a prerelease if none exists.
#
# With the signing secrets set (see "Releasing from CI" in the README), the app
# and DMG are signed with the Developer ID certificate and the DMG is notarized
# and stapled. Without them the build is ad-hoc signed, as before.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    name: Package Mac DMG
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      SIGNED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen

      # A throwaway keychain holds the certificate and the notary credentials,
      # and becomes the default so codesign and notarytool find them.
      - name: Set up signing
        if: env.SIGNED == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$keychain"

          # The team ID comes from the certificate's name, "Developer ID Application: Name (TEAMID)".
          team=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"Developer ID Application: .*(\([A-Z0-9]*\))".*/\1/p' | head -1)
          [ -n "$team" ] || { echo "The certificate has no Developer ID Application identity." >&2; exit 1; }
          echo "TEAM_ID=$team" >> "$GITHUB_ENV"

          printf '%s\n' "$API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials grimoire-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"

      - name: Package
        run: scripts/package-mac.sh "${TAG#v}"
      - name: Upload to release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --prerelease --verify-tag --title "Grimoire ${TAG#v}" --generate-notes
          gh release upload "$TAG" dist/*.dmg dist/*.sha256 --clobber

      - name: Remove the signing keychain and key
        if: always() && env.SIGNED == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
