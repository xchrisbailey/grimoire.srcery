name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Everything targets the macOS 27 / iOS 27 SDKs, so jobs run on GitHub's
# Xcode 27 image (arm64, public preview). Set the MACOS_RUNNER repository
# variable to use another runner, such as a self-hosted Mac.
jobs:
  packages:
    name: Package tests
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    strategy:
      fail-fast: false
      matrix:
        package: [GrimoireCore, GrimoireEditor, GrimoireIntelligence]
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: swift test
        working-directory: Packages/${{ matrix.package }}
        run: swift test
      - name: Parse speed (release build)
        if: matrix.package == 'GrimoireCore'
        working-directory: Packages/GrimoireCore
        run: swift test -c release --filter PerformanceTests

  apps:
    name: Build ${{ matrix.scheme }}
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: GrimoireMac
            destination: platform=macOS
          - scheme: GrimoireiOS
            destination: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: xcodebuild
        run: >
          xcodebuild build
          -project Grimoire.xcodeproj
          -scheme ${{ matrix.scheme }}
          -destination '${{ matrix.destination }}'
          CODE_SIGNING_ALLOWED=NO

  lint:
    name: Lint
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    steps:
      - uses: actions/checkout@v4
      - name: swift-format
        run: xcrun swift-format lint --strict --recursive Apps Packages
      - name: SwiftLint
        run: brew install swiftlint && swiftlint --strict
