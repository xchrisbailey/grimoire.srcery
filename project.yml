name: Grimoire
options:
  bundleIdPrefix: computer.srcery
  deploymentTarget:
    macOS: "27.0"
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: Grimoire
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Grimoire
packages:
  GrimoireCore:
    path: Packages/GrimoireCore
  GrimoireEditor:
    path: Packages/GrimoireEditor
  GrimoireIntelligence:
    path: Packages/GrimoireIntelligence
targets:
  GrimoireMac:
    type: application
    platform: macOS
    sources:
      - Apps/GrimoireMac
      - Apps/Shared
      - Resources
      - path: Brand/Grimoire.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: GrimoireCore
      - package: GrimoireEditor
      - package: GrimoireIntelligence
    settings:
      base:
        PRODUCT_NAME: Grimoire
        PRODUCT_BUNDLE_IDENTIFIER: computer.srcery.grimoire
        SDKROOT: macosx
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        CODE_SIGN_ENTITLEMENTS: Apps/GrimoireMac/GrimoireMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
  GrimoireiOS:
    type: application
    platform: iOS
    sources:
      - Apps/GrimoireiOS
      - Apps/Shared
      - Resources
      - path: Brand/Grimoire.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: GrimoireCore
      - package: GrimoireEditor
      - package: GrimoireIntelligence
    settings:
      base:
        PRODUCT_NAME: Grimoire
        PRODUCT_BUNDLE_IDENTIFIER: computer.srcery.grimoire
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
schemes:
  GrimoireMac:
    build:
      targets:
        GrimoireMac: all
    run:
      config: Debug
  GrimoireiOS:
    build:
      targets:
        GrimoireiOS: all
    run:
      config: Debug
